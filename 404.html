<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Instant Messenger</title>
  <script>
    // GitHub Pages SPA redirect
    // GitHub Pages returns this 404.html for any URL that doesn't map to a real file.
    // We encode the intended path as a "?/..." query string and redirect to the app
    // root so that index.html can restore it via history.replaceState.
    //
    // pathSegmentsToKeep:
    //   0 → root/user-page deployment  (e.g. https://user.github.io/)
    //   1 → project-page deployment    (e.g. https://user.github.io/repo/)
    //
    // The deploy workflow uses VITE_BASE_PATH = /<repo-name>/, so use 1 for the
    // default CI deployment.  Override to 0 only for a custom-domain or user-page
    // deployment where the app lives at the domain root.
    var pathSegmentsToKeep = 1;

    var l = window.location;
    l.replace(
      l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
      l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
      l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
      (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
      l.hash
    );
  </script>
</head>
<body></body>
</html>
